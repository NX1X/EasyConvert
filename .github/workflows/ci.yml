name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cdn-version-consistency:
    name: CDN version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check pinned cdnjs versions and SRI hashes
        run: bash scripts/check-cdn-versions.sh

      - name: Check app version is in sync across package.json, sw.js, index.html
        run: bash scripts/check-version-sync.sh

  action-pinning:
    name: Actions pinned to SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail if any action is not SHA-pinned
        run: bash scripts/check-action-pins.sh
