<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="EasyConvert icon">
  <!-- App tile: soft-black ground, grid-monogram E in white with one mid-grey accent cell.
       Full-bleed rounded background keeps it safe as a maskable PWA / touch icon. -->
  <rect width="100" height="100" rx="22" fill="#18181b"/>
  <g>
    <!-- top bar -->
    <rect x="21.5" y="21.5" width="15" height="15" rx="3" fill="#fafafa"/>
    <rect x="42.5" y="21.5" width="15" height="15" rx="3" fill="#fafafa"/>
    <rect x="63.5" y="21.5" width="15" height="15" rx="3" fill="#a1a1aa"/>
    <!-- middle bar (short) + left stem -->
    <rect x="21.5" y="42.5" width="15" height="15" rx="3" fill="#fafafa"/>
    <rect x="42.5" y="42.5" width="15" height="15" rx="3" fill="#fafafa"/>
    <!-- bottom bar -->
    <rect x="21.5" y="63.5" width="15" height="15" rx="3" fill="#fafafa"/>
    <rect x="42.5" y="63.5" width="15" height="15" rx="3" fill="#fafafa"/>
    <rect x="63.5" y="63.5" width="15" height="15" rx="3" fill="#fafafa"/>
  </g>
</svg>
