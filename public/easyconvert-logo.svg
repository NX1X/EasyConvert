    <rect x="39" y="39" width="22" height="22" rx="4" fill="#fafafa"/>
    <rect x="10" y="68" width="22" height="22" rx="4" fill="#fafafa"/>
    <rect x="39" y="68" width="22" height="22" rx="4" fill="#fafafa"/>
    <rect x="68" y="68" width="22" height="22" rx="4" fill="#fafafa"/>
